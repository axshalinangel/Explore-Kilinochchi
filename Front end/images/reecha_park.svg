<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  <!-- Sky -->
  <rect x="0" y="0" width="600" height="180" fill="#86efac" fill-opacity="0.25"/>
  <!-- Sun -->
  <circle cx="500" cy="70" r="45" fill="#fde68a" fill-opacity="0.9"/>
  <!-- Ground -->
  <ellipse cx="300" cy="380" rx="320" ry="60" fill="#052e16" fill-opacity="0.5"/>
  <!-- Trees -->
  <polygon points="120,280 155,160 190,280" fill="#15803d"/>
  <polygon points="100,290 155,130 210,290" fill="#166534"/>
  <polygon points="380,280 420,155 460,280" fill="#15803d"/>
  <polygon points="365,290 420,125 475,290" fill="#166534"/>
  <!-- Tree trunks -->
  <rect x="147" y="278" width="16" height="40" fill="#92400e"/>
  <rect x="411" y="278" width="16" height="40" fill="#92400e"/>
  <!-- Center fountain base -->
  <ellipse cx="300" cy="310" rx="60" ry="18" fill="#0369a1" fill-opacity="0.7"/>
  <rect x="285" y="250" width="30" height="62" fill="#075985" fill-opacity="0.8"/>
  <!-- Water spray lines -->
  <line x1="300" y1="248" x2="275" y2="215" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="248" x2="300" y2="210" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="248" x2="325" y2="215" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
  <!-- Text -->
  <text x="300" y="356" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">ReeCha Theme Park</text>
  <text x="300" y="382" font-size="13" fill="#bbf7d0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" letter-spacing="2">RECREATIONAL &amp; NATURE</text>
</svg>