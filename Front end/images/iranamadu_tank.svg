<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="water3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="600" height="400" fill="url(#sky3)"/>
  <!-- Clouds -->
  <ellipse cx="150" cy="70" rx="60" ry="22" fill="#ffffff" fill-opacity="0.7"/>
  <ellipse cx="190" cy="58" rx="45" ry="20" fill="#ffffff" fill-opacity="0.7"/>
  <ellipse cx="430" cy="90" rx="50" ry="18" fill="#ffffff" fill-opacity="0.6"/>
  <!-- Dam wall -->
  <rect x="0" y="218" width="600" height="30" fill="#78716c"/>
  <rect x="0" y="215" width="600" height="8" fill="#a8a29e"/>
  <!-- Water body -->
  <rect x="0" y="248" width="600" height="152" fill="url(#water3)"/>
  <!-- Water ripples -->
  <ellipse cx="200" cy="280" rx="80" ry="10" fill="#38bdf8" fill-opacity="0.4"/>
  <ellipse cx="400" cy="310" rx="100" ry="12" fill="#38bdf8" fill-opacity="0.3"/>
  <ellipse cx="120" cy="340" rx="60" ry="8" fill="#7dd3fc" fill-opacity="0.3"/>
  <!-- Sunset reflection line -->
  <rect x="265" y="248" width="70" height="152" fill="#fbbf24" fill-opacity="0.12"/>
  <!-- Sun near horizon -->
  <circle cx="300" cy="200" r="28" fill="#fde68a" fill-opacity="0.9"/>
  <line x1="300" y1="163" x2="300" y2="152" stroke="#fde68a" stroke-width="3"/>
  <line x1="322" y1="171" x2="330" y2="162" stroke="#fde68a" stroke-width="3"/>
  <line x1="278" y1="171" x2="270" y2="162" stroke="#fde68a" stroke-width="3"/>
  <!-- Birds -->
  <path d="M80 100 Q90 92 100 100" stroke="#1e3a5f" stroke-width="2" fill="none"/>
  <path d="M115 88 Q125 80 135 88" stroke="#1e3a5f" stroke-width="2" fill="none"/>
  <!-- Text -->
  <text x="300" y="356" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Iranamadu Tank</text>
  <text x="300" y="382" font-size="13" fill="#bae6fd" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" letter-spacing="2">NATURE &amp; SCENIC</text>
</svg>