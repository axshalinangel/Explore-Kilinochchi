<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg2)"/>
  <!-- Sky with soft light -->
  <rect x="0" y="0" width="600" height="200" fill="#1e3a5f" fill-opacity="0.4"/>
  <!-- Ground -->
  <rect x="0" y="330" width="600" height="70" fill="#1f2937"/>
  <!-- Steps -->
  <rect x="200" y="310" width="200" height="25" rx="2" fill="#374151"/>
  <rect x="215" y="290" width="170" height="25" rx="2" fill="#4b5563"/>
  <!-- Lotus monument pillar -->
  <rect x="278" y="140" width="44" height="155" fill="#9ca3af"/>
  <rect x="285" y="140" width="30" height="155" fill="#d1d5db"/>
  <!-- Lotus petals at top -->
  <ellipse cx="300" cy="138" rx="30" ry="14" fill="#e5e7eb"/>
  <ellipse cx="276" cy="148" rx="18" ry="10" fill="#d1d5db" transform="rotate(-25,276,148)"/>
  <ellipse cx="324" cy="148" rx="18" ry="10" fill="#d1d5db" transform="rotate(25,324,148)"/>
  <ellipse cx="262" cy="165" rx="14" ry="8" fill="#9ca3af" transform="rotate(-40,262,165)"/>
  <ellipse cx="338" cy="165" rx="14" ry="8" fill="#9ca3af" transform="rotate(40,338,165)"/>
  <!-- Candles/lights at base -->
  <rect x="240" y="298" width="8" height="16" fill="#fde68a"/>
  <ellipse cx="244" cy="298" rx="4" ry="5" fill="#fbbf24"/>
  <rect x="352" y="298" width="8" height="16" fill="#fde68a"/>
  <ellipse cx="356" cy="298" rx="4" ry="5" fill="#fbbf24"/>
  <!-- Text -->
  <text x="300" y="356" font-size="21" font-weight="bold" fill="#f9fafb" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Kilinochchi War Memorial</text>
  <text x="300" y="382" font-size="13" fill="#9ca3af" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" letter-spacing="2">HISTORICAL &amp; HERITAGE</text>
</svg>